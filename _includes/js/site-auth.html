<script>
(function () {
    const baseUrl = {{ site.baseurl | default: "" | jsonify }};
    const homeUrl = {{ '/' | relative_url | jsonify }};
    const archiveUrl = {{ '/archive.html' | relative_url | jsonify }};
    const browseUrl = {{ '/browse.html' | relative_url | jsonify }};
    const staffEnabled = {{ site.data.theme.staff-gate-enabled | default: false | jsonify }};
    const staffSessionKey = {{ site.data.theme.staff-gate-session-key | default: 'jsu-african-art-access' | jsonify }};
    const staffPasswordSha = {{ site.data.theme.staff-gate-password-sha256 | default: "" | jsonify }};
    const staffPublicPaths = {{ site.data.theme.staff-gate-public-paths | default: '/;/about.html;/archive.html' | jsonify }}.split(";").map(normalizePath);
    const staffLabel = {{ site.data.theme.staff-gate-label | default: 'Full Portal' | jsonify }};

    function normalizePath(path) {
        if (!path) return "/";
        let normalized = path;
        if (/^https?:\/\//i.test(normalized)) {
            try {
                normalized = new URL(normalized, window.location.origin).pathname;
            } catch (error) {
                normalized = "/";
            }
        }
        if (baseUrl && normalized.indexOf(baseUrl) === 0) {
            normalized = normalized.slice(baseUrl.length) || "/";
        }
        if (normalized.endsWith("/index.html")) normalized = normalized.slice(0, -10) || "/";
        if (normalized.length > 1 && normalized.endsWith("/")) normalized = normalized.slice(0, -1);
        return normalized || "/";
    }

    function getSanitizedNextTarget(rawTarget) {
        if (!rawTarget) return browseUrl;
        let target = rawTarget;
        try {
            const absolute = new URL(rawTarget, window.location.origin);
            const normalizedTarget = normalizePath(absolute.pathname);
            if (normalizedTarget === normalizePath(homeUrl) && absolute.searchParams.get("portal") === "required") {
                return browseUrl;
            }
            absolute.searchParams.delete("portal");
            const nestedNext = absolute.searchParams.get("next");
            if (nestedNext && nestedNext === rawTarget) {
                absolute.searchParams.delete("next");
            }
            target = absolute.pathname + absolute.search + absolute.hash;
        } catch (error) {
            target = rawTarget;
        }
        return target || browseUrl;
    }

    async function sha256(value) {
        const bytes = new TextEncoder().encode(value);
        const digest = await window.crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    function isPortalUnlocked() {
        return !staffEnabled || window.localStorage.getItem(staffSessionKey) === "granted";
    }

    function setPortalSession(granted) {
        if (granted) {
            window.localStorage.setItem(staffSessionKey, "granted");
        } else {
            window.localStorage.removeItem(staffSessionKey);
        }
        setUnlockedState();
    }

    function isPublicPath(path) {
        return staffPublicPaths.indexOf(normalizePath(path)) > -1;
    }

    function isProtectedPath(path) {
        if (!staffEnabled) return false;
        const normalized = normalizePath(path);
        if (isPublicPath(normalized)) return false;
        return true;
    }

    function getRequestedTarget() {
        const params = new URLSearchParams(window.location.search);
        return getSanitizedNextTarget(params.get("next"));
    }

    function setUnlockedState() {
        const portalUnlocked = isPortalUnlocked();

        document.body.classList.remove("collection-locked", "collection-unlocked");
        document.body.classList.add(portalUnlocked ? "collection-unlocked" : "collection-locked", "auth-ready");

        document.querySelectorAll("[data-protected-nav]").forEach((el) => {
            el.classList.toggle("d-none", !portalUnlocked);
        });

        document.querySelectorAll("[data-staff-auth-form]").forEach((el) => {
            el.classList.toggle("d-none", portalUnlocked);
        });
        document.querySelectorAll("[data-auth-open]").forEach((el) => {
            el.classList.toggle("d-none", !portalUnlocked);
        });
        document.querySelectorAll("[data-auth-logout]").forEach((el) => {
            el.classList.toggle("d-none", !portalUnlocked);
        });
    }

    function showAlert(message, tone) {
        document.querySelectorAll("[data-auth-alert]").forEach((el) => {
            el.textContent = message;
            el.className = "access-alert";
            if (tone) el.classList.add("access-alert-" + tone);
            el.classList.remove("d-none");
        });
    }

    function clearAlert() {
        document.querySelectorAll("[data-auth-alert]").forEach((el) => {
            el.textContent = "";
            el.classList.add("d-none");
        });
    }

    async function handleStaffSubmit(event) {
        event.preventDefault();
        clearAlert();

        const form = event.currentTarget;
        const passwordInput = form.querySelector('input[type="password"]');
        const submitButton = form.querySelector('button[type="submit"]');
        const password = passwordInput.value || "";

        if (!password) {
            showAlert("Enter the full portal password to continue.", "error");
            return;
        }
        if (!staffPasswordSha) {
            showAlert("The full portal password is not configured yet.", "error");
            return;
        }

        const originalText = submitButton.textContent;
        submitButton.disabled = true;
        submitButton.textContent = "Opening...";
        try {
            const digest = await sha256(password);
            if (digest !== staffPasswordSha) {
                throw new Error("That full portal password was not recognized.");
            }
            passwordInput.value = "";
            setPortalSession(true);
            window.location.assign(getRequestedTarget());
        } catch (error) {
            showAlert(error.message || "The full portal could not be opened.", "error");
            passwordInput.value = "";
            passwordInput.focus();
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = originalText;
        }
    }

    function handleStaffLogout(event) {
        if (event) event.preventDefault();
        setPortalSession(false);
        if (isProtectedPath(window.location.pathname)) {
            window.location.assign(homeUrl);
        }
    }

    function enforcePortalGate() {
        if (!staffEnabled) return;
        if (isPortalUnlocked()) return;
        if (!isProtectedPath(window.location.pathname)) return;
        const currentParams = new URLSearchParams(window.location.search);
        if (normalizePath(window.location.pathname) === normalizePath(homeUrl) && currentParams.get("portal") === "required") return;
        const next = encodeURIComponent(window.location.pathname + window.location.search + window.location.hash);
        window.location.replace(homeUrl + "?portal=required&next=" + next);
    }

    function maybeShowPortalPrompt() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("portal") !== "required") return;
        showAlert("Enter the full portal password to open image-bearing records and research tools.", "info");
    }

    enforcePortalGate();
    setUnlockedState();
    maybeShowPortalPrompt();

    document.querySelectorAll("[data-staff-auth-form]").forEach((el) => {
        el.addEventListener("submit", handleStaffSubmit);
    });
    document.querySelectorAll("[data-auth-logout]").forEach((el) => {
        el.addEventListener("click", handleStaffLogout);
    });
    document.querySelectorAll("[data-auth-open]").forEach((el) => {
        el.addEventListener("click", function (event) {
            if (isPortalUnlocked()) return;
            event.preventDefault();
            const portalInput = document.querySelector(".nav-auth-form input[type='password']");
            if (portalInput) portalInput.focus();
            showAlert("Enter the " + staffLabel.toLowerCase() + " password to continue.", "info");
        });
    });
})();
</script>
