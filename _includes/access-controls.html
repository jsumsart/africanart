<div class="banner-access-controls d-flex align-items-center gap-2">
    <form class="nav-auth-form" data-staff-auth-form>
        <span class="nav-gate-label">Full portal</span>
        <label class="visually-hidden" for="banner-portal-password">Portal password</label>
        <input class="form-control form-control-sm nav-auth-input nav-portal-input" id="banner-portal-password" name="password" type="password" autocomplete="current-password" placeholder="Portal password" required>
        <button class="btn btn-sm btn-outline-light nav-auth-submit" type="submit" aria-label="Open full portal">Enter</button>
    </form>
    <a class="btn btn-sm btn-outline-light d-none" href="{{ '/browse.html' | relative_url }}" data-auth-open aria-label="Open full portal">Open portal</a>
    <button class="btn btn-sm btn-outline-light d-none" type="button" data-auth-logout aria-label="Sign out of full portal">Close portal</button>
    <div class="access-alert d-none banner-access-alert" data-auth-alert></div>
</div>
